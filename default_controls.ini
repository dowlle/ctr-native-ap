; CTR Native control configuration (controls.ini).
;
; This is a template. The game reads and writes controls.ini in the folder it is
; started from, next to config.ini; copy this file to that name to start from it.
; The Controls page (Options -> Controls) writes the file, but it can also be
; edited by hand. Ported from CTR Native Expanded by thecodingbob (GPL-3.0).
; Values are host control names, not numbers:
;   keyboard  an SDL scancode name, e.g. "C", "Left Shift", "Space"
;   gamepad   an SDL gamepad button or axis name, e.g. "a", "left shoulder",
;             "lefttrigger", "lefty". "none" unbinds the control.
;
; Player assignment is automatic unless a player is pinned to a device key:
;   auto      P1 takes the first gamepad; the keyboard is the last fallback
;   disabled  the player deliberately has no device (player 1 cannot be disabled)
;   <key>     the name of a device section below, held for as long as it is plugged in
;
; P1 always ends up with a device. If a pad under P1 is unplugged, the keyboard
; moves to P1 automatically.
;
; Each device section also carries:
;   deadzone  percentage of the stick's travel to ignore around centre, 0 to 90.
;             0 is the console's own behaviour and trims nothing. Raise it for a stick
;             that drifts.
;
; [AP Shortcuts] holds the Archipelago keyboard shortcuts, as keyboard key names or
; "none". One key never does two things: a key on a keyboard game control and on a
; shortcut stays with the game control and the shortcut loads unbound. The dev_
; shortcuts only show on the AP Shortcuts screen with dev_keys=1 in ap-config.txt,
; and except for the two stats test modes they only work with it too. A file without this section
; uses the defaults below.

[Assignment]
player1 = auto
player2 = auto
player3 = auto
player4 = auto

[device keyboard]
name = Keyboard
deadzone = 0
cross = C
circle = V
triangle = Z
square = X
l1 = Left Shift
l2 = Left Ctrl
l3 = [
r1 = Right Shift
r2 = Right Ctrl
r3 = ]
dpad_up = Up
dpad_down = Down
dpad_left = Left
dpad_right = Right
start = Return
select = Space
axis_left_x = none
axis_left_y = none
axis_right_x = none
axis_right_y = none

[AP Shortcuts]
character_picker = Keypad 9
dev_progressive_mode = Keypad 0
dev_editable_mode = Keypad .
dev_trap_icy = Keypad 1
dev_trap_low_gravity = Keypad 2
dev_trap_no_brakes = Keypad 3
dev_trap_boost = Keypad 4
dev_trap_first_person = Keypad 5
dev_trap_all = Keypad 6
dev_shortcutless = Keypad 7
dev_mark_quad = Keypad 8
dev_demo_camera = Keypad +
