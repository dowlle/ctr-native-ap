name: Release rehearsal

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      apworld_branch:
        description: Companion apworld branch (empty uses the normal base)
        type: string
        default: ''
  pull_request:
    paths:
      - tools/ci/package-client.py
      - tools/release/**
      - tools/solo/**
      - tools/verify-release.py
      - CMakeLists.txt
      - .github/workflows/**

# This workflow assembles temporary assets only. It has no tag, release or
# signing permissions; the artifact expires after one day.
permissions:
  contents: read
  actions: read

concurrency:
  group: rehearsal-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rehearse:
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(github.event_name == 'schedule' && '["main"]' || format('["{0}"]', github.ref_name)) }}
    uses: ./.github/workflows/release-assembly.yml
    with:
      mode: rehearsal
      version: 0.0.0-rehearsal
      rehearsal_label: ${{ (matrix.branch == 'main' || github.base_ref == 'main') && 'main' || 'dev' }}
      native_ref: ${{ github.event_name == 'pull_request' && github.sha || matrix.branch }}
      apworld_branch: ${{ inputs.apworld_branch || 'main' }}
      apworld_companion_branch: ${{ github.event_name == 'pull_request' && github.head_ref || inputs.apworld_branch || '' }}
      apworld_companion_required: ${{ github.event_name == 'workflow_dispatch' && inputs.apworld_branch != '' }}
      pr_number: ${{ github.event_name == 'pull_request' && format('{0}', github.event.pull_request.number) || '' }}
      pr_head_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

  smoke-solo:
    name: Bundled Play Solo / ${{ matrix.platform }}
    needs: rehearse
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            archive: ctr-archipelago-v0.0.0-rehearsal-windows-x86.zip
            interpreter: python/python.exe
          - platform: linux
            os: ubuntu-24.04
            archive: ctr-archipelago-v0.0.0-rehearsal-linux-x86.tar.gz
            interpreter: python/bin/python3.12
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ctr-release-rehearsal-${{ (github.ref_name == 'main' || github.base_ref == 'main') && 'main' || 'dev' }}
      - name: Generate a Quick room with the bundled interpreter
        env:
          ARCHIVE: ${{ matrix.archive }}
          INTERPRETER: ${{ matrix.interpreter }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          shutil.unpack_archive(os.environ["ARCHIVE"], "client")
          (client,) = Path("client").iterdir()
          runtime = client / "solo-runtime"
          digest = hashlib.sha256((client / "ctr.apworld").read_bytes()).hexdigest()
          result = subprocess.run([
              str(runtime / os.environ["INTERPRETER"]), str(runtime / "ctr_solo.py"),
              "--apworld-sha256", digest, "generate", "--yaml", str(runtime / "presets/quick.yaml"),
              "--preset", "quick", "--seed", "10725", "--name", "AppieCTR",
          ], stdout=subprocess.PIPE, text=True, timeout=120)
          print(result.stdout, end="")
          result.check_returncode()
          room = json.loads(result.stdout.splitlines()[-1])
          if (room["event"] != "result" or room["slot"] != "AppieCTR"
                  or room["locations_total"] <= 0 or room["apworld_sha256"] != digest):
              raise SystemExit(f"unexpected Solo generation result: {room}")
