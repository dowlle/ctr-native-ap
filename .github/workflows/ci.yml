name: CI

# Host harnesses: every tools/test-*.c and .cpp listed in tools/ci/harnesses.txt
# is compiled against the freestanding _logic.h headers and run. A new harness
# file that is not listed (or skipped with a reason) fails the job, so adding a
# harness means deciding whether CI runs it. The 32-bit C++ harnesses compile the
# real slot_data parser and need the pinned vendor headers, fetched by
# ap/vendor/fetch-deps.sh exactly as a build does.

on:
  pull_request:
  push:
    branches: [main, 'release/**', 'ci/**']

permissions:
  contents: read

jobs:
  harnesses:
    name: host harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (32-bit capable)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-multilib g++-multilib
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -q libssl-dev:i386 zlib1g-dev:i386 openssl
      - name: Vendor headers (pinned by ap/vendor/versions.lock)
        run: bash ap/vendor/fetch-deps.sh
      - name: Build and run
        run: python3 tools/ci/run-harnesses.py
      - name: BSP instance collision regression
        run: python3 tools/test-bsp-instance.py
      - name: Production custom CTR results
        run: python3 tools/test-custom-ctr-result.py
      - name: Production custom letter verifier
        run: python3 tools/test-custom-letter-verifier.py
      - name: Production custom race picker
        run: python3 tools/test-custom-race-picker.py
      - name: Production custom letter hooks
        run: python3 tools/test-custom-letter-hooks.py
      - name: Custom package profile activation
        run: python3 tools/test-custom-profile-activation.py
      - name: Oxide optional-first production win notifications
        run: python3 tools/test-oxide-optional-result.py
      - name: Trial and retail letter availability visuals
        run: python3 tools/test-trial-letter-visual.py
      - name: Trial podium production fan-out
        run: python3 tools/test-trial-podium-result.py
      - name: Tunnel character swap production readiness
        run: python3 tools/test-tunnel-charswap-production.py
      - name: Trial hub pad state transitions
        run: python3 tools/test-trial-pad-state-production.py
      - name: All-track CTR letter-ready timeline
        run: python3 tools/test-letter-ready-feed-production.py
      - name: Persisted hub door production regressions
        run: python3 tools/test-door-history-production.py
      - name: TLS and cache boundary regressions
        run: bash tools/security/run.sh
      - name: Release assembly boundary checks
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'
